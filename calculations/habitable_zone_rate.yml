unique_name: Habitable Zone Rate
object_type: metric_calc
label: Habitable Zone Rate
description: The proportion of the planets whose habitable zone can be evaluated that sit inside it. A
  FRACTION from 0 to 1; warehouse-wide 28/1533, or 0.018265.
expression: CASE WHEN ISEMPTY([Measures].[Planets With An Equilibrium Temperature]) OR [Measures].[Planets
  With An Equilibrium Temperature] = 0 THEN NULL ELSE [Measures].[Habitable Zone Planet Count] / [Measures].[Planets
  With An Equilibrium Temperature] END
