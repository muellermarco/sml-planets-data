unique_name: High Eccentricity Rate
object_type: metric_calc
label: High Eccentricity Rate
description: Among planets carrying an eccentricity, the share above 0.25. A FRACTION from 0 to 1; warehouse-wide
  249/974, or 0.25565.
expression: CASE WHEN ISEMPTY([Measures].[Planets With An Eccentricity]) OR [Measures].[Planets With An
  Eccentricity] = 0 THEN NULL ELSE [Measures].[High Eccentricity Count] / [Measures].[Planets With An
  Eccentricity] END
