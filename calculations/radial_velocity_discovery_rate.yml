unique_name: Radial Velocity Discovery Rate
object_type: metric_calc
label: Radial Velocity Discovery Rate
description: The proportion of the selected planets discovered by radial velocity. A FRACTION from 0 to
  1; warehouse-wide 591/3372, or 0.17527.
expression: CASE WHEN ISEMPTY([Measures].[Planet Count]) OR [Measures].[Planet Count] = 0 THEN NULL ELSE
  [Measures].[Radial Velocity Discovery Count] / [Measures].[Planet Count] END
