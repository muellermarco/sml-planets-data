unique_name: Observed Planet Rate
object_type: metric_calc
label: Observed Planet Rate
description: The proportion of the selected planets observed by at least one of the three surveys. A FRACTION
  from 0 to 1; warehouse-wide 2460/3372, or 0.72953. It uses the distinct planet count on the observation
  bridge, so a planet observed twice still counts once.
expression: CASE WHEN ISEMPTY([Measures].[Planet Count]) OR [Measures].[Planet Count] = 0 THEN NULL ELSE
  [Measures].[Distinct Observed Planet Count] / [Measures].[Planet Count] END
