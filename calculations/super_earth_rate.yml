unique_name: Super Earth Rate
object_type: metric_calc
label: Super Earth Rate
description: Among planets carrying a density, the share that are super-Earths. A FRACTION from 0 to 1;
  warehouse-wide 31/388, or 0.079897.
expression: CASE WHEN ISEMPTY([Measures].[Planets With A Density]) OR [Measures].[Planets With A Density]
  = 0 THEN NULL ELSE [Measures].[Super Earth Count] / [Measures].[Planets With A Density] END
