unique_name: Rocky Planet Rate
object_type: metric_calc
label: Rocky Planet Rate
description: Among planets carrying a density, the share that are rocky. A FRACTION from 0 to 1; warehouse-wide
  74/388, or 0.19072.
expression: CASE WHEN ISEMPTY([Measures].[Planets With A Density]) OR [Measures].[Planets With A Density]
  = 0 THEN NULL ELSE [Measures].[Rocky Planet Count] / [Measures].[Planets With A Density] END
