    - unique_name: Host Stellar Mass
      label: Host Stellar Mass
      dataset: Planet Detail
      key_columns:
      - host_stellar_mass
      name_column: host_stellar_mass
      folder: Host Star Snapshot
      description: Host star's mass in solar masses. 0.02 to 3.9 on 3051 of the 3372 planets, averaging
