    - unique_name: Eccentricity Relative Uncertainty
      label: Eccentricity Relative Uncertainty
      dataset: Planet Detail
      key_columns:
      - eccentricity_relative_uncertainty
      name_column: eccentricity_relative_uncertainty
      folder: Measurement Quality
      description: Relative uncertainty in the eccentricity, as a percentage. 0.059 to 12550 percent on
