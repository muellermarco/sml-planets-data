    - unique_name: Habitable Zone Outer AU
      label: Habitable Zone Outer AU
      dataset: Planet Detail
      key_columns:
      - habitable_zone_outer_au
      name_column: habitable_zone_outer_au
      folder: Host Star Snapshot
      description: Outer edge of the habitable zone in AU - the square root of the luminosity over 0.53.
        0.00122 to 34.50 on 2978 planets, averaging 1.747. This figure is computed at the Planet Detail
        grain; 'Star Habitable Zone Outer' is the same quantity at the Star Detail grain, where it averages
        1.866. The readings disagree because the grains differ, so say which basis you mean, and ask if
        the question does not.
    - unique_name: Planet Companion Count
      label: Planet Companion Count
      dataset: Planet Detail
      key_columns:
      - companion_count
      name_column: companion_count
      folder: Host Star Snapshot
      description: Number of planetary companions the host star declares. 1 to 7 on all 3372 planets,
        averaging 1.765. More than 1 puts the planet in a multi-planetary system, which is true for 1431
        of the 3372 planets. This figure is computed at the Planet Detail grain; 'Star Companion Count'
        is the same quantity at the Star Detail grain, where it averages 1.344. The readings disagree
        because the grains differ, so say which basis you mean, and ask if the question does not.
    - unique_name: Period Relative Uncertainty
      label: Period Relative Uncertainty
      dataset: Planet Detail
      key_columns:
      - period_relative_uncertainty
      name_column: period_relative_uncertainty
      folder: Measurement Quality
      description: Relative uncertainty in the orbital period, as a percentage - half the spread between
