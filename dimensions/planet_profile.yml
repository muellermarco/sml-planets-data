    - unique_name: Radius Relative Uncertainty
      label: Radius Relative Uncertainty
      dataset: Planet Detail
      key_columns:
      - radius_relative_uncertainty
      name_column: radius_relative_uncertainty
      folder: Measurement Quality
      description: Relative uncertainty in the planet radius, as a percentage. 0 to 3899 percent on 2656
