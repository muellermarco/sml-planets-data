    - unique_name: Habitable Zone Inner AU
      label: Habitable Zone Inner AU
      dataset: Planet Detail
      key_columns:
      - habitable_zone_inner_au
      name_column: habitable_zone_inner_au
      folder: Host Star Snapshot
      description: Habitable Zone Inner Boundary in AU - the square root of the luminosity over 1.1. 0.00085
        to 23.95 on 2978 planets, averaging 1.212. This figure is computed at the Planet Detail grain;
        'Star Habitable Zone Inner' is the same quantity at the Star Detail grain, where it averages 1.296.
