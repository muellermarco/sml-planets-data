    - unique_name: Inclination Relative Uncertainty
      label: Inclination Relative Uncertainty
      dataset: Planet Detail
      key_columns:
      - inclination_relative_uncertainty
      name_column: inclination_relative_uncertainty
      folder: Measurement Quality
