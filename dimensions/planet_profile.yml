    - unique_name: Host Stellar Luminosity
      label: Host Stellar Luminosity
      dataset: Planet Detail
      key_columns:
      - host_stellar_luminosity
      name_column: host_stellar_luminosity
      folder: Host Star Snapshot
      description: Host star's luminosity relative to the Sun - the radius squared times the temperature
