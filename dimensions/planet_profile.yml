unique_name: Planet Profile
object_type: dimension
label: Planet Profile
type: standard
description: 'Every knowledge-base formula that lands on a planet, as a queryable attribute, each evaluated
  in consistent SI units from the standard physical constants written out in full. Velocities carry kilometres
  per second under the bare name with a metres-per-second twin; the transit depth is a fraction with a
  percent twin. Orbital Profile: The planet''s orbit, from the orbital record that covers 3371 of the
  3372 planets - though its individual columns are much sparser than that. Physical Profile: The planet''s
  mass, size and density, from the physical record that covers 3359 planets - but a mass exists for only
  1174 and a density for 388, and those two numbers bound most of the classifications in this model. Host
  Star Snapshot: The host star''s properties carried onto the planet row, so a planet-level question does
  not need a join. These are the same values the Star Record dimension publishes; use these when filtering
  or projecting alongside planet measures and the Star Record dimension when the question groups stars.
  Measurement Quality Profile: Relative uncertainties, limit flags and blend flags. Read the populations
  before using any of these: on this warehouse almost every blend flag and almost every upper-limit flag
  is zero, so the concepts they express select nobody, and the model says so rather than leaving the emptiness
  to be discovered. Planet Classification Profile: Knowledge-base planet classifications, each with the
  population it selects and the number of planets it cannot judge. Read those numbers first: a density
  exists for only 388 planets and a mass for 1174, so several of these classifications are undecidable
  for most of the catalogue. Every flag follows SQL''s own three-valued logic: ''Yes'' when the definition
  holds, ''No'' when it is definitely false - for a compound definition, as soon as one condition is recorded
  false - and null only when nothing recorded settles it. So filtering on ''No'' selects exactly the planets
  a NOT of the definition keeps. Survey Observation Profile: Which of the three surveys observed the planet,
  as per-planet flags so a question can filter without joining the observation bridge. 2460 of the 3372
  planets were observed by at least one survey and none by more than two.'
is_degenerate: true
level_attributes:
- unique_name: Planet Profile Key
  label: Planet Profile Key
  dataset: Planet Detail
  key_columns:
  - planet
  name_column: planet
  is_hidden: true
hierarchies:
- unique_name: Planet Profile Hierarchy
  label: Planet Profile
  filter_empty: 'yes'
  folder: Derived Planet Quantities
  levels:
  - unique_name: Planet Profile Key
    is_hidden: true
    secondary_attributes:
    - unique_name: Surface Gravity
      label: Surface Gravity
      dataset: Planet Detail
      key_columns:
      - surface_gravity
      name_column: surface_gravity
      folder: Derived Planet Quantities
      description: Planet Surface Gravity relative to Earth's - mass in Earth units over radius in Earth
        units squared. 0.0052 to 1254.7 on the 509 planets that have BOTH a mass and a radius, averaging
        22.23. Earth is 1 by construction.
    - unique_name: Mass Radius Ratio
      label: Mass Radius Ratio
      dataset: Planet Detail
      key_columns:
      - mass_radius_ratio
      name_column: mass_radius_ratio
      folder: Derived Planet Quantities
      description: Mass in Earth units divided by radius in Earth units - the mass-radius relationship.
        0.0323 to 2742 on the same 509 planets, averaging 81.3.
    - unique_name: Escape Velocity
      label: Escape Velocity
      dataset: Planet Detail
      key_columns:
      - escape_velocity_kms
      name_column: escape_velocity_kms
      folder: Derived Planet Quantities
      description: 'Planet Escape Velocity - the speed needed to escape the planet, in KILOMETRES PER
        SECOND: the square root of twice G times the mass over the radius, with the Jupiter-unit mass
        and radius converted to kilograms and metres, divided by 1000. From 2.009 km/s on the 509 planets
        with both a mass and a radius, averaging 66.96. The twin Escape Velocity (Metres Per Second) is
        the same figure times 1000. Physical constants are the standard published values, written out
        and composed inside the formula rather than pre-multiplied: G = 6.67430E-11, solar mass 1.98847E30
        kg, solar radius 6.957E8 m, astronomical unit 1.496E11 m, Jupiter mass 1.898E27 kg, Jupiter radius
        7.1492E7 m, 109.2 Earth radii per solar radius.'
    - unique_name: Escape Velocity (Metres Per Second)
      label: Escape Velocity (Metres Per Second)
      dataset: Planet Detail
      key_columns:
      - escape_velocity_ms
      name_column: escape_velocity_ms
      folder: Derived Planet Quantities
      description: The same escape velocity in metres per second, as the SI formula yields it before dividing
        by 1000. 2009 to 585,451 m/s on 509 planets, averaging 66,962.
    - unique_name: Orbital Velocity
      label: Orbital Velocity
      dataset: Planet Detail
      key_columns:
      - orbital_velocity_kms
      name_column: orbital_velocity_kms
      folder: Derived Planet Quantities
      description: 'Mean orbital speed assuming a circular orbit, in KILOMETRES PER SECOND - orbital velocity,
        speed. The square root of G times the stellar mass over the semi-major axis, with the solar-unit
        mass and the AU converted to kilograms and metres, divided by 1000. 0.235 to 531.29 km/s on the
        1593 planets with both a stellar mass and a semi-major axis, averaging 82.09. The twin Orbital
        Velocity (Metres Per Second) is the same figure times 1000. A listing that asks for the planets''
        speed lists only the planets that have one - filter this column IS NOT NULL - because a planet
        with no recorded semi-major axis has no velocity and does not belong in a speed report; filtering
        on the classification flags alone leaves such a planet in as a blank row. Physical constants are
        the standard published values, written out and composed inside the formula rather than pre-multiplied:
        G = 6.67430E-11, solar mass 1.98847E30 kg, solar radius 6.957E8 m, astronomical unit 1.496E11
        m, Jupiter mass 1.898E27 kg, Jupiter radius 7.1492E7 m, 109.2 Earth radii per solar radius.'
    - unique_name: Orbital Velocity (Metres Per Second)
      label: Orbital Velocity (Metres Per Second)
      dataset: Planet Detail
      key_columns:
      - orbital_velocity_ms
      name_column: orbital_velocity_ms
      folder: Derived Planet Quantities
      description: The same orbital velocity in metres per second, as the SI formula yields it. 235 to
        531,293 m/s on 1593 planets, averaging 82,094.
    - unique_name: Equilibrium Temperature
      label: Equilibrium Temperature
      dataset: Planet Detail
      key_columns:
      - equilibrium_temperature
      name_column: equilibrium_temperature
      folder: Derived Planet Quantities
      description: 'The Planetary Equilibrium Temperature in KELVIN - the stellar temperature times the
        square root of the stellar radius over twice the semi-major axis, with the radius in solar radii
        and the axis in AU both converted to metres so the ratio under the root is dimensionless. From
        2.94 K on the 1533 planets with all three inputs, averaging 886.7 K. A reading that leaves solar
        radii over AU unconverted is about 14.7 times larger and is not published, because a formula over
        two lengths is a formula over one unit. Physical constants are the standard published values,
        written out and composed inside the formula rather than pre-multiplied: G = 6.67430E-11, solar
        mass 1.98847E30 kg, solar radius 6.957E8 m, astronomical unit 1.496E11 m, Jupiter mass 1.898E27
        kg, Jupiter radius 7.1492E7 m, 109.2 Earth radii per solar radius.'
    - unique_name: Transit Depth
      label: Transit Depth
      dataset: Planet Detail
      key_columns:
      - transit_depth
      name_column: transit_depth
      folder: Derived Planet Quantities
      description: 'Fractional drop in the star''s brightness during a transit - the planet radius over
        the stellar radius, squared, both radii in EARTH radii (the planet radius times 11.209, the stellar
        radius times 109.2). A FRACTION from 0 to 1: 1.3e-05 to 1.135 on the 2684 planets with both radii,
        averaging 0.00294. The twin Transit Depth (Percent) is the same figure times 100; whether a question
        wants the fraction or the percent is the caller''s to decide, so ask when it is not said. Physical
        constants are the standard published values, written out and composed inside the formula rather
        than pre-multiplied: G = 6.67430E-11, solar mass 1.98847E30 kg, solar radius 6.957E8 m, astronomical
        unit 1.496E11 m, Jupiter mass 1.898E27 kg, Jupiter radius 7.1492E7 m, 109.2 Earth radii per solar
        radius.'
    - unique_name: Transit Depth (Percent)
      label: Transit Depth (Percent)
      dataset: Planet Detail
      key_columns:
      - transit_depth_percent
      name_column: transit_depth_percent
      folder: Derived Planet Quantities
      description: The same transit depth as a PERCENTAGE - the fraction times 100. 0.0013 to 113.47 on
        2684 planets, averaging 0.294.
    - unique_name: Planet Star Mass Ratio
      label: Planet Star Mass Ratio
      dataset: Planet Detail
      key_columns:
      - planet_star_mass_ratio
      name_column: planet_star_mass_ratio
      folder: Derived Planet Quantities
      description: Planet mass divided by stellar mass, both in kilograms - the mass ratio. 1.9e-07 to
        0.700 on the 1127 planets with both, averaging 0.00586. The planet mass is Jupiter masses times
        1.898E27 and the stellar mass solar masses times 1.98847E30, because the knowledge base requires
        both masses in the same units; the ratio is a pure number. Kepler-131 c, the super-Earth with
        the strongest surface gravity, reads 2.433e-05.
    - unique_name: Kepler Derived Stellar Mass
      label: Kepler Derived Stellar Mass
      dataset: Planet Detail
      key_columns:
      - kepler_derived_stellar_mass
      name_column: kepler_derived_stellar_mass
      folder: Derived Planet Quantities
      description: 'Stellar mass in solar masses derived from the planet''s orbit - the semi-major axis
        in AU cubed over the period in YEARS squared. 0.0233 to 3.915 on 1831 planets, averaging 1.019.
        Null on the other 1541 planets, whose period or semi-major axis is unrecorded. A comparison of
        the recorded mass with this derived one runs over the planets that carry a derived value, so filter
        this column IS NOT NULL: a planet picked by its semi-major axis - the outermost of a system, say
        - can still lack a period, and without the filter it prints a blank derived mass as a row of its
        own. The recorded Host Stellar Mass is independent of this: 1517 of the 1541 with no derived mass
        carry a recorded host mass, and 297 of the 1831 with a derived mass have no recorded one, so a
        condition on the recorded mass is a different screen from a condition on this one. The period
        must be converted from days to years for this to work; using days gives a number about 133,000
        times too small.'
    - unique_name: Kepler Mass Difference
      label: Kepler Mass Difference
      dataset: Planet Detail
      key_columns:
      - kepler_mass_difference
      name_column: kepler_mass_difference
      folder: Derived Planet Quantities
      description: The Kepler-derived stellar mass minus the mass the star record reports, signed. -0.889
        to 1.019 on the 1534 planets where both exist, averaging 0.0139 - so the law checks out on average,
        with individual disagreements up to about one solar mass. Kepler Mass Absolute Difference drops
        the sign for ranking by how far apart the two are.
    - unique_name: Kepler Mass Absolute Difference
      label: Kepler Mass Absolute Difference
      dataset: Planet Detail
      key_columns:
      - kepler_mass_absolute_difference
      name_column: kepler_mass_absolute_difference
      folder: Derived Planet Quantities
      description: How far the Kepler-derived stellar mass is from the recorded one, regardless of direction
        - the absolute discrepancy, the size of the disagreement. 0 to 1.019 solar masses on 1534 planets,
        averaging 0.0501. The natural sort key when recorded and derived masses are compared side by side;
        null where the star has no recorded mass, and such rows still carry a derived mass.
    - unique_name: Goldilocks Value
      label: Goldilocks Value
      dataset: Planet Detail
      key_columns:
      - goldilocks_value
      name_column: goldilocks_value
      folder: Derived Planet Quantities
      description: How centred the planet is in its star's habitable zone - the semi-major axis minus
        the inner boundary, over the width of the zone. -2.27 to 21361 on 1533 planets, averaging 15.58.
        A value of 0.5 is perfectly centred, between 0 and 1 is inside the zone, negative is too close
        to the star and above 1 too far. The huge maximum reflects planets thousands of times further
        out than their zone.
    - unique_name: Planet Distance Light Years (All Recorded)
      label: Planet Distance Light Years (All Recorded)
      dataset: Planet Detail
      key_columns:
      - stellar_distance_ly
      name_column: stellar_distance_ly
      folder: Derived Planet Quantities
      description: Distance to the planet's host star in light-years, converting parsecs by multiplying
        by 3.26156. 10.47 to 27723 ly on the 2296 planets whose star records a distance, averaging 2035.
        Carries every recorded distance whatever its quality flags say; Planet Distance Light Years is the same figure nulled wherever a quality flag is raised. This figure is
        computed at the Planet Detail grain; 'Stellar Distance Light Years' is the same quantity at the
        Star Detail grain, where it averages 2153.8. The readings disagree because the grains differ,
        so say which basis you mean, and ask if the question does not.
    - unique_name: Planet Distance Light Years
      label: Planet Distance Light Years
      dataset: Planet Detail
      key_columns:
      - stellar_distance_ly_clean
      name_column: stellar_distance_ly_clean
      folder: Derived Planet Quantities
      description: Distance to the planet's host star in light-years, kept only when neither of the warehouse's
        two ever-set quality flags is raised on the measurement - the distance is not an upper limit (Distance
        Upper Limit = 'No') and the magnitude is not blended (Magnitude Blended = 'No') - and null otherwise,
        including when either flag is missing. Present on 2283 planets, averaging 2041.2 ly; Planet Distance Light Years (All Recorded) carries every recorded distance, flag-clean or not, 2296 planets averaging 2035.
    - unique_name: Planet Distance Parsecs
      label: Planet Distance Parsecs
      dataset: Planet Detail
      key_columns:
      - stellar_distance_pc
      name_column: stellar_distance_pc
      folder: Derived Planet Quantities
      description: Distance to the planet's host star in parsecs. 3.21 to 8500 pc on 2296 planets, averaging
        623.9. This figure is computed at the Planet Detail grain; 'Stellar Distance Parsecs' is the same
        quantity at the Star Detail grain, where it averages 660.4. The readings disagree because the
        grains differ, so say which basis you mean, and ask if the question does not.
    - unique_name: Orbital Period
      label: Orbital Period
      dataset: Planet Detail
      key_columns:
      - orbital_period_days
      name_column: orbital_period_days
      folder: Orbital Properties
      description: Time to complete one orbit, in DAYS as the warehouse records it - orbital period, year
        length, length of a year. 0.0907 to 7,300,000 days on the 3305 planets that record one, averaging
        2726. The range spans eight orders of magnitude, so an unweighted mean is dominated by a handful
        of very wide orbits. Below 10 days is the short-period condition, met by 1445 planets. A twin,
        Orbital Period (Years), divides by 365.25; the recorded days are what a plain reading of the warehouse
        reports, and the twin is the input Kepler's third law needs.
    - unique_name: Orbital Period (Years)
      label: Orbital Period (Years)
      dataset: Planet Detail
      key_columns:
      - orbital_period_years
      name_column: orbital_period_years
      folder: Orbital Properties
      description: The recorded period divided by 365.25, in years. 0.000248 to 19986 years, averaging
        7.463. It is the denominator in the Kepler's-law mass check, which needs years rather than days;
        for the period itself use Orbital Period, which carries the recorded days.
    - unique_name: Semi Major Axis AU
      label: Semi Major Axis AU
      dataset: Planet Detail
      key_columns:
      - semi_major_axis_au
      name_column: semi_major_axis_au
      folder: Orbital Properties
      description: Mean orbital distance in astronomical units - semi-major axis, orbital distance. 0.0044
        to 2500 AU on only 1897 planets, averaging 7.70. Its sparseness is the binding constraint on the
        equilibrium temperature, the orbital velocity, the habitable-zone test and the Kepler's-law check.
    - unique_name: Eccentricity
      label: Eccentricity
      dataset: Planet Detail
      key_columns:
      - eccentricity
      name_column: eccentricity
      folder: Orbital Properties
      description: How far the orbit departs from a circle - eccentricity, how weird the orbit is. 0 to
        0.956 on 974 planets, averaging 0.171. Zero is a perfect circle; above 0.25 is the high-eccentricity
        condition, met by 249 planets.
    - unique_name: Inclination Degrees
      label: Inclination Degrees
      dataset: Planet Detail
      key_columns:
      - inclination_degrees
      name_column: inclination_degrees
      folder: Orbital Properties
      description: Orbital inclination in degrees - inclination, orbital tilt. 17.6 to 90.76 degrees on
        only 502 planets, averaging 85.9. The maximum is 90.76, barely above the 90-degree retrograde
        threshold, so only 8 planets in the whole catalogue orbit retrograde on the strict reading - and
        21 more sit at exactly 90.0 degrees, edge-on, which is why Retrograde Orbit (90 Degrees Or More)
        ships beside Retrograde Orbit.
    - unique_name: Next Planet Period Days
      label: Next Planet Period Days
      dataset: Planet Detail
      key_columns:
      - next_planet_period_days
      name_column: next_planet_period_days
      folder: Orbital Properties
      description: Orbital period of the next planet outward in the same system, in days. Present for
        861 planets - those with at least one longer-period sibling. Null for the outermost planet of
        every system and for every single-planet system.
    - unique_name: Next Planet Period Ratio
      label: Next Planet Period Ratio
      dataset: Planet Detail
      key_columns:
      - next_planet_period_ratio
      name_column: next_planet_period_ratio
      folder: Orbital Properties
      description: The next planet's period divided by this one's - the Orbital Period Ratio for this
        adjacent pair. 1.006 to 4482 on 861 planets, averaging 20.36. Adjacent pairs are taken in order
        of period within each host star.
    - unique_name: Planet Mass Jupiter
      label: Planet Mass Jupiter
      dataset: Planet Detail
      key_columns:
      - planet_mass_jupiter
      name_column: planet_mass_jupiter
      folder: Physical Properties
      description: Mass in Jupiter masses - mass, planet mass. 0.00006 to 28.5 on only 1174 of the 3372
        planets, averaging 2.628. Above 0.1 is the gas-giant condition, met by 929 planets. Earth is about
        0.003 Jupiter masses.
    - unique_name: Planet Mass Earth
      label: Planet Mass Earth
      dataset: Planet Detail
      key_columns:
      - planet_mass_earth
      name_column: planet_mass_earth
      folder: Physical Properties
      description: The Planet Mass in Earth Units - the Jupiter figure multiplied by 317.83. 0.0191 to
        9058 on 1174 planets, averaging 835.4. Between 1 and 10 is half the super-Earth condition.
    - unique_name: Planet Radius Jupiter
      label: Planet Radius Jupiter
      dataset: Planet Detail
      key_columns:
      - planet_radius_jupiter
      name_column: planet_radius_jupiter
      folder: Physical Properties
      description: Radius in Jupiter radii - radius, size. 0.027 to 6.9 on 2694 planets, averaging 0.342.
        Earth is about 0.09 Jupiter radii.
    - unique_name: Planet Radius Earth
      label: Planet Radius Earth
      dataset: Planet Detail
      key_columns:
      - planet_radius_earth
      name_column: planet_radius_earth
      folder: Physical Properties
      description: The Planet Radius in Earth Units - the Jupiter figure multiplied by 11.209. 0.303 to
        77.3 on 2694 planets, averaging 3.833.
    - unique_name: Planet Density
      label: Planet Density
      dataset: Planet Detail
      key_columns:
      - planet_density
      name_column: planet_density
      folder: Physical Properties
      description: Bulk density in grams per cubic centimetre - density. 0.03 to 77.7 on only 388 of the
        3372 planets, averaging 2.559. Above 3 is the rocky condition, met by 74 planets; below 0.5 with
        a giant mass is the inflated condition, met by 103. Earth is about 5.5. Because a density exists
        for so few planets, EVERY rocky, super-Earth, inflated-giant and potentially-habitable answer
