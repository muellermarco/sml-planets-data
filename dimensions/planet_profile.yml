    - unique_name: Mass Relative Uncertainty
      label: Mass Relative Uncertainty
      dataset: Planet Detail
      key_columns:
      - mass_relative_uncertainty
      name_column: mass_relative_uncertainty
      folder: Measurement Quality
      description: Relative uncertainty in the planet mass, as a percentage. 0.198 to 7990 percent on
        987 planets, averaging 30.3. Only 198 planets are under 5 percent, which makes mass the binding
