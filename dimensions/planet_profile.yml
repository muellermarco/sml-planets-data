    - unique_name: Host Stellar Temperature
      label: Host Stellar Temperature
      dataset: Planet Detail
      key_columns:
      - host_stellar_temperature
      name_column: host_stellar_temperature
      folder: Host Star Snapshot
      description: Host star's effective temperature in Kelvin. 575 to 57000 on 3205 planets, averaging
