unique_name: Survey Facility Detail
object_type: dataset
label: Survey Facility Detail
columns:
  - name: facility
    data_type: string
  - name: facility_key
    data_type: double
  - name: facility_description
    data_type: string
  - name: facility_row_count
    data_type: int
connection_id: bird_planets_data
qds_materialization: true
sql: |-
  SELECT
      i.facilityname                                      AS facility,
      CAST(i.instrumentref AS DOUBLE)                   AS facility_key,
      CASE i.facilityname WHEN 'kep' THEN 'Kepler mission'
           WHEN 'k2' THEN 'K2 mission'
           WHEN 'ttv' THEN 'Transit timing variations' END AS facility_description,
      1                                                   AS facility_row_count
  FROM bird.planets_data.instruments_surveys i
