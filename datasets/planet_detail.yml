connection_id: bird_planets_data
qds_materialization: true
sql: >-
  SELECT q.*,
    CASE WHEN q.orbital_period_days IS NOT NULL THEN 1 ELSE 0 END AS has_orbital_period_days,
    CASE WHEN q.semi_major_axis_au IS NOT NULL THEN 1 ELSE 0 END AS has_semi_major_axis_au,
    CASE WHEN q.planet_mass_jupiter IS NOT NULL THEN 1 ELSE 0 END AS has_planet_mass_jupiter,
    CASE WHEN q.planet_radius_jupiter IS NOT NULL THEN 1 ELSE 0 END AS has_planet_radius_jupiter,
    CASE WHEN q.planet_density IS NOT NULL THEN 1 ELSE 0 END AS has_planet_density,
    CASE WHEN q.eccentricity IS NOT NULL THEN 1 ELSE 0 END AS has_eccentricity,
    CASE WHEN q.inclination_degrees IS NOT NULL THEN 1 ELSE 0 END AS has_inclination_degrees,
    CASE WHEN q.surface_gravity IS NOT NULL THEN 1 ELSE 0 END AS has_surface_gravity,
    CASE WHEN q.equilibrium_temperature IS NOT NULL THEN 1 ELSE 0 END AS has_equilibrium_temperature,
    CASE WHEN q.transit_depth IS NOT NULL THEN 1 ELSE 0 END AS has_transit_depth,
    CASE WHEN q.orbital_velocity_ms IS NOT NULL THEN 1 ELSE 0 END AS has_orbital_velocity_ms,
    CASE WHEN q.planet_star_mass_ratio IS NOT NULL THEN 1 ELSE 0 END AS has_planet_star_mass_ratio,
    CASE WHEN q.kepler_derived_stellar_mass IS NOT NULL THEN 1 ELSE 0 END AS has_kepler_derived_stellar_mass,
    CASE WHEN q.stellar_distance_pc IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_distance_pc,
    CASE WHEN q.next_planet_period_ratio IS NOT NULL THEN 1 ELSE 0 END AS has_next_planet_period_ratio,
    q.orbital_period_days AS orbital_period_days_measure,
    q.semi_major_axis_au AS semi_major_axis_au_measure,
    q.eccentricity AS eccentricity_measure,
    q.inclination_degrees AS inclination_degrees_measure,
    q.next_planet_period_ratio AS next_planet_period_ratio_measure,
    q.planet_mass_jupiter AS planet_mass_jupiter_measure,
    q.planet_mass_earth AS planet_mass_earth_measure,
    q.planet_radius_jupiter AS planet_radius_jupiter_measure,
    q.planet_radius_earth AS planet_radius_earth_measure,
    q.planet_density AS planet_density_measure,
    q.note_count AS note_count_measure,
    q.surface_gravity AS surface_gravity_measure,
    q.mass_radius_ratio AS mass_radius_ratio_measure,
    q.escape_velocity_kms AS escape_velocity_kms_measure,
    q.orbital_velocity_kms AS orbital_velocity_kms_measure,
    q.equilibrium_temperature AS equilibrium_temperature_measure,
    q.transit_depth AS transit_depth_measure,
    q.planet_star_mass_ratio AS planet_star_mass_ratio_measure,
    q.kepler_derived_stellar_mass AS kepler_derived_stellar_mass_measure,
    q.kepler_mass_difference AS kepler_mass_difference_measure,
    q.kepler_mass_absolute_difference AS kepler_mass_absolute_difference_measure,
    q.goldilocks_value AS goldilocks_value_measure,
    q.stellar_distance_ly AS stellar_distance_ly_measure,
    q.stellar_distance_ly_clean AS stellar_distance_ly_clean_measure,
    q.kepler_observation_indicator AS kepler_observation_indicator_measure,
    q.k2_observation_indicator AS k2_observation_indicator_measure,
    q.ttv_observation_indicator AS ttv_observation_indicator_measure,
    q.period_relative_uncertainty AS period_relative_uncertainty_measure,
    q.mass_relative_uncertainty AS mass_relative_uncertainty_measure,
    q.radius_relative_uncertainty AS radius_relative_uncertainty_measure,
    q.density_relative_uncertainty AS density_relative_uncertainty_measure,
    q.eccentricity_relative_uncertainty AS eccentricity_relative_uncertainty_measure
  FROM (

  WITH obs AS (
      SELECT
          io.subjectlink                                  AS planet,
          max(CASE WHEN i.facilityname = 'kep' THEN 1 ELSE 0 END) AS kepler_flag,
          max(CASE WHEN i.facilityname = 'k2' THEN 1 ELSE 0 END)  AS k2_flag,
          max(CASE WHEN i.facilityname = 'ttv' THEN 1 ELSE 0 END) AS ttv_flag,
          count(*)                                        AS observation_count
      FROM bird.planets_data.planet_instrument_observations io
      JOIN bird.planets_data.instruments_surveys i ON i.instrumentref = io.facilitylink
      GROUP BY io.subjectlink
  ),

  ordered AS (
      SELECT
          pp.planetref                                    AS planet,
          pp.hostlink                                     AS star,
          oo.period                                       AS period,
          lead(oo.period) OVER (
              PARTITION BY pp.hostlink
              ORDER BY oo.period)                         AS next_period
      FROM bird.planets_data.planets pp
      LEFT JOIN bird.planets_data.orbital_characteristics oo ON oo.bodylink = pp.planetref
  )

  SELECT
      p.planetref                                         AS planet,
      p.hostlink                                          AS star,
      s.hostplname                                        AS host_star_name,
      concat(s.hostplname, ' ', p.completter)             AS planet_name,
      p.completter                                        AS companion_letter,
      CAST(p.notecount AS DOUBLE)                       AS note_count,
      p.discmethod                                        AS discovery_method_stored,
      CASE WHEN lower(trim(p.discmethod)) IN ('radvel', 'rv', 'rv method', 'radial velocity', 'doppler') THEN 'Radial Velocity' WHEN lower(trim(p.discmethod)) IN ('transit', 'tr', 'transit method', 'photometry', 'photometric') THEN 'Transit' WHEN lower(trim(p.discmethod)) IN ('direct imaging', 'di', 'imaging', 'img', 'direct') THEN 'Imaging' WHEN lower(trim(p.discmethod)) IN ('ttv', 'transit timing variations', 'transit timing', 'ttv method', 'timing var') THEN 'TTV' WHEN lower(trim(p.discmethod)) IN ('microlensing', 'ml', 'lensing', 'gravitational') OR trim(p.discmethod) = concat(decode(unhex('CEBC'), 'UTF-8'), 'Lens') THEN 'Microlensing' ELSE 'Other' END                                AS discovery_method,
      CASE WHEN CASE WHEN lower(trim(p.discmethod)) IN ('radvel', 'rv', 'rv method', 'radial velocity', 'doppler') THEN 'Radial Velocity' WHEN lower(trim(p.discmethod)) IN ('transit', 'tr', 'transit method', 'photometry', 'photometric') THEN 'Transit' WHEN lower(trim(p.discmethod)) IN ('direct imaging', 'di', 'imaging', 'img', 'direct') THEN 'Imaging' WHEN lower(trim(p.discmethod)) IN ('ttv', 'transit timing variations', 'transit timing', 'ttv method', 'timing var') THEN 'TTV' WHEN lower(trim(p.discmethod)) IN ('microlensing', 'ml', 'lensing', 'gravitational') OR trim(p.discmethod) = concat(decode(unhex('CEBC'), 'UTF-8'), 'Lens') THEN 'Microlensing' ELSE 'Other' END = 'Transit' THEN 1 ELSE 0 END                                      AS transit_discovery_indicator,
      CASE WHEN CASE WHEN lower(trim(p.discmethod)) IN ('radvel', 'rv', 'rv method', 'radial velocity', 'doppler') THEN 'Radial Velocity' WHEN lower(trim(p.discmethod)) IN ('transit', 'tr', 'transit method', 'photometry', 'photometric') THEN 'Transit' WHEN lower(trim(p.discmethod)) IN ('direct imaging', 'di', 'imaging', 'img', 'direct') THEN 'Imaging' WHEN lower(trim(p.discmethod)) IN ('ttv', 'transit timing variations', 'transit timing', 'ttv method', 'timing var') THEN 'TTV' WHEN lower(trim(p.discmethod)) IN ('microlensing', 'ml', 'lensing', 'gravitational') OR trim(p.discmethod) = concat(decode(unhex('CEBC'), 'UTF-8'), 'Lens') THEN 'Microlensing' ELSE 'Other' END = 'Radial Velocity' THEN 1 ELSE 0 END                                       AS radial_velocity_indicator,
      CAST(CAST(CAST((o.period) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                        AS orbital_period_days,
      (o.period / 365.25)                        AS orbital_period_years,
      CAST(CAST(CAST((o.semimajor) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                     AS semi_major_axis_au,
      CAST(CAST(CAST((o.eccentricity) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                           AS eccentricity,
      CAST(CAST(CAST((o.inclination) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                          AS inclination_degrees,
      CAST(CAST(CAST((ph.massjup) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                        AS planet_mass_jupiter,
      (ph.massjup * 317.83)                                            AS planet_mass_earth,
      CAST(CAST(CAST((ph.radjup) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                         AS planet_radius_jupiter,
      (ph.radjup * 11.209)                                             AS planet_radius_earth,
      CAST(CAST(CAST((ph.densvalue) AS FLOAT) AS STRING) AS DECIMAL(38,10))                                       AS planet_density,
      ((ph.massjup * 317.83) / NULLIF(POWER((ph.radjup * 11.209), 2), 0))                                   AS surface_gravity,
      ((ph.massjup * 317.83) / NULLIF((ph.radjup * 11.209), 0))                                 AS mass_radius_ratio,
      (SQRT(2 * 6.67430E-11 * ph.massjup * 1.898E27 / NULLIF(ph.radjup * 7.1492E7, 0)) / 1000)                       AS escape_velocity_kms,
      SQRT(2 * 6.67430E-11 * ph.massjup * 1.898E27 / NULLIF(ph.radjup * 7.1492E7, 0))                                AS escape_velocity_ms,
      (SQRT((6.67430E-11 * CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) * 1.98847E30) / NULLIF(o.semimajor * 1.496E11, 0)) / 1000)                      AS orbital_velocity_kms,
      SQRT((6.67430E-11 * CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) * 1.98847E30) / NULLIF(o.semimajor * 1.496E11, 0))                               AS orbital_velocity_ms,
      (CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) * SQRT(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT) * 6.957E8 / NULLIF(2 * o.semimajor * 1.496E11, 0)))                                           AS equilibrium_temperature,
      POWER((ph.radjup * 11.209) / NULLIF(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT) * 109.2, 0), 2)                                     AS transit_depth,
      (POWER((ph.radjup * 11.209) / NULLIF(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT) * 109.2, 0), 2) * 100)                                 AS transit_depth_percent,
      ((ph.massjup * 1.898E27) / NULLIF(CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) * 1.98847E30, 0))                                        AS planet_star_mass_ratio,
      (POWER(o.semimajor, 3) / NULLIF(POWER(o.period / 365.25, 2), 0))                                       AS kepler_derived_stellar_mass,
      ((POWER(o.semimajor, 3) / NULLIF(POWER(o.period / 365.25, 2), 0)) - CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT))                                       AS kepler_mass_difference,
      abs(((POWER(o.semimajor, 3) / NULLIF(POWER(o.period / 365.25, 2), 0)) - CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT)))                                  AS kepler_mass_absolute_difference,
      ((o.semimajor - SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1)) / NULLIF(SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53) - SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1), 0))                                        AS goldilocks_value,
      CAST(CAST(CAST((ord.next_period) AS FLOAT) AS STRING) AS DECIMAL(38,10))                             AS next_planet_period_days,
      (ord.next_period / NULLIF(o.period, 0))             AS next_planet_period_ratio,
      CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS DECIMAL(38,10))                                    AS host_stellar_mass,
      CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS DECIMAL(38,10))                                  AS host_stellar_radius,
      CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS DECIMAL(38,10))                                    AS host_stellar_temperature,
      (POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4))                                        AS host_stellar_luminosity,
      SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1)                                          AS habitable_zone_inner_au,
      SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53)                                          AS habitable_zone_outer_au,
      CAST(CAST(CAST((s.stellardist) AS FLOAT) AS STRING) AS DECIMAL(38,10))                               AS stellar_distance_pc,
      (s.stellardist * 3.26156)                       AS stellar_distance_ly,
      CASE WHEN CASE WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END = 'No'
            AND CASE WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) IS NOT NULL THEN 'No' END = 'No'
           THEN s.stellardist * 3.26156 END           AS stellar_distance_ly_clean,
      CAST(s.compcount AS DOUBLE)                       AS companion_count,
      (((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)                                        AS period_relative_uncertainty,
      (((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)                                          AS mass_relative_uncertainty,
      (((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)                                        AS radius_relative_uncertainty,
      (((q.semimajerr1 - q.semimajerr2) / 2.0) / NULLIF(o.semimajor, 0) * 100.0)                                     AS semi_major_relative_uncertainty,
      (((q.eccerr1 - q.eccerr2) / 2.0) / NULLIF(o.eccentricity, 0) * 100.0)                                           AS eccentricity_relative_uncertainty,
      (((q.inclerr1 - q.inclerr2) / 2.0) / NULLIF(o.inclination, 0) * 100.0)                                          AS inclination_relative_uncertainty,
      (((q.denserr1 - q.denserr2) / 2.0) / NULLIF(ph.densvalue, 0) * 100.0)                                       AS density_relative_uncertainty,
      q.masssource                                        AS mass_source,
      CASE WHEN q.masssource = 'Msini' THEN 'Yes'
           WHEN q.masssource IS NOT NULL THEN 'No' END    AS minimum_mass_status,
      q.updatestamp                                       AS record_update_date,
      CAST(year(q.updatestamp) AS DOUBLE)                    AS record_update_year,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Period_Lim')) AS DOUBLE)                         AS period_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Semimaj_Lim')) AS DOUBLE)                        AS semi_major_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Ecc_Lim')) AS DOUBLE)                            AS eccentricity_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Incl_Lim')) AS DOUBLE)                           AS inclination_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Mass_Lim')) AS DOUBLE)                           AS mass_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Rad_Lim')) AS DOUBLE)                            AS radius_limit_flag,
      CAST((get_json_object(q.limitflags, '$.planetary_limits.Dens_Lim')) AS DOUBLE)                           AS density_limit_flag,
      CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE)                           AS distance_limit_flag,
      CAST((get_json_object(q.limitflags, '$.stellar_limits.Temp_Lim')) AS DOUBLE)                           AS temperature_limit_flag,
      CAST((get_json_object(q.limitflags, '$.stellar_limits.OptMag_Lim')) AS DOUBLE)                         AS magnitude_limit_flag,
      CAST((get_json_object(q.limitflags, '$.stellar_limits.StellarRad_Lim')) AS DOUBLE)                     AS stellar_radius_limit_flag,
      CAST((get_json_object(q.limitflags, '$.stellar_limits.StellarMass_Lim')) AS DOUBLE)                    AS stellar_mass_limit_flag,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Period_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Period_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                AS period_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Ecc_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Ecc_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                   AS eccentricity_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Incl_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Incl_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                  AS inclination_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Mass_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Mass_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                  AS mass_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Rad_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Rad_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                   AS radius_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Dens_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Dens_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                  AS density_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                  AS distance_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Temp_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Temp_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END                  AS stellar_temperature_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.StellarMass_Lim')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.StellarMass_Lim')) AS DOUBLE) IS NOT NULL THEN 'No' END           AS stellar_mass_upper_limit,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Rad_Lim')) AS DOUBLE) = 1 THEN 1 ELSE 0 END
                                                          AS radius_upper_limit_indicator,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.planetary_limits.Mass_Lim')) AS DOUBLE) = 1 THEN 1 ELSE 0 END
                                                          AS mass_upper_limit_indicator,
      CASE WHEN CAST((get_json_object(q.limitflags, '$.stellar_limits.Dist_Lim')) AS DOUBLE) = 1 THEN 1 ELSE 0 END
                                                          AS distance_upper_limit_indicator,
      CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE)                         AS temperature_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.physical.Mass_Blend')) AS DOUBLE)                         AS stellar_mass_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.physical.Rad_Blend')) AS DOUBLE)                          AS stellar_radius_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE)                          AS magnitude_blend_flag,
      CASE WHEN CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE) IS NOT NULL THEN 'No' END                AS temperature_blended,
      CASE WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) IS NOT NULL THEN 'No' END                 AS magnitude_blended,
      CASE WHEN CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE) = 1 THEN 1 ELSE 0 END
                                                          AS temperature_blend_indicator,
      CASE WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) = 1 THEN 1 ELSE 0 END
                                                          AS magnitude_blend_indicator,
      CASE WHEN COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Mass_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Rad_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE), 0) = 1
           THEN 'Yes' ELSE 'No' END                       AS any_stellar_blend,
      COALESCE(obs.kepler_flag, 0)                        AS kepler_observation_indicator,
      COALESCE(obs.k2_flag, 0)                            AS k2_observation_indicator,
      COALESCE(obs.ttv_flag, 0)                           AS ttv_observation_indicator,
      CAST(COALESCE(obs.observation_count, 0) AS DOUBLE) AS observation_count,
      CASE WHEN obs.planet IS NULL THEN 'No' ELSE 'Yes' END AS observed_by_a_survey,
      CASE WHEN ph.massjup > 0.1 THEN 'Yes' WHEN ph.massjup <= 0.1 THEN 'No' END                      AS gas_giant_planet,
      CASE WHEN ph.massjup > 0.1 THEN 1 ELSE 0 END           AS gas_giant_indicator,
      CASE WHEN ph.densvalue > 3 THEN 'Yes' WHEN ph.densvalue <= 3 THEN 'No' END                              AS rocky_planet,
      CASE WHEN ph.densvalue > 3 THEN 1 ELSE 0 END               AS rocky_indicator,
      CASE WHEN o.period < 10 THEN 'Yes' WHEN o.period >= 10 THEN 'No' END                              AS short_period_planet,
      CASE WHEN o.period < 10 THEN 1 ELSE 0 END               AS short_period_indicator,
      CASE WHEN ph.massjup > 0.1 AND o.period < 10 THEN 'Yes' WHEN ph.massjup <= 0.1 OR o.period >= 10 THEN 'No' END
                                                          AS hot_jupiter,
      CASE WHEN ph.massjup > 0.1 AND o.period < 10 THEN 1 ELSE 0 END
                                                          AS hot_jupiter_indicator,
      CASE WHEN ph.densvalue > 3 AND (ph.massjup * 317.83) BETWEEN 1 AND 10 THEN 'Yes' WHEN ph.densvalue <= 3 OR ((ph.massjup * 317.83) < 1 OR (ph.massjup * 317.83) > 10) THEN 'No' END
                                                          AS super_earth,
      CASE WHEN ph.densvalue > 3 AND (ph.massjup * 317.83) BETWEEN 1 AND 10 THEN 1 ELSE 0 END
                                                          AS super_earth_indicator,
      CASE WHEN o.semimajor BETWEEN SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) AND SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53) THEN 'Yes' WHEN (o.semimajor < SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) OR o.semimajor > SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53)) THEN 'No' END                                    AS planet_in_habitable_zone,
      CASE WHEN o.semimajor BETWEEN SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) AND SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53) THEN 1 ELSE 0 END                  AS habitable_zone_indicator,
      CASE WHEN ph.densvalue > 3 AND o.semimajor BETWEEN SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) AND SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53) THEN 'Yes' WHEN ph.densvalue <= 3 OR (o.semimajor < SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) OR o.semimajor > SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53)) THEN 'No' END
                                                          AS potentially_habitable,
      CASE WHEN ph.densvalue > 3 AND o.semimajor BETWEEN SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1) AND SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53) THEN 1 ELSE 0 END    AS potentially_habitable_indicator,
      CASE WHEN o.eccentricity > 0.25 THEN 'Yes' WHEN o.eccentricity <= 0.25 THEN 'No' END             AS high_eccentricity_planet,
      CASE WHEN o.eccentricity > 0.25 THEN 1 ELSE 0 END            AS high_eccentricity_indicator,
      CASE WHEN o.inclination > 90 THEN 'Yes' WHEN o.inclination <= 90 THEN 'No' END               AS retrograde_orbit,
      CASE WHEN o.inclination > 90 THEN 1 ELSE 0 END             AS retrograde_indicator,
      CASE WHEN o.inclination >= 90 THEN 'Yes' WHEN o.inclination < 90 THEN 'No' END               AS retrograde_orbit_inclusive,
      CASE WHEN o.inclination >= 90 THEN 1 ELSE 0 END            AS retrograde_inclusive_indicator,
      CASE WHEN ph.massjup > 0.1 AND ph.densvalue < 0.5 THEN 'Yes' WHEN ph.massjup <= 0.1 OR ph.densvalue >= 0.5 THEN 'No' END
                                                          AS inflated_gas_giant,
      CASE WHEN ph.massjup > 0.1 AND ph.densvalue < 0.5 THEN 1 ELSE 0 END
                                                          AS inflated_gas_giant_indicator,
      CASE WHEN s.compcount > 1 THEN 'Yes' ELSE 'No' END  AS in_multi_planetary_system,
      CASE WHEN abs((((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)) < 5 THEN 'Yes' WHEN abs((((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)) >= 5 THEN 'No' END                            AS period_high_precision,
      CASE WHEN abs((((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)) < 5 THEN 'Yes' WHEN abs((((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)) >= 5 THEN 'No' END                            AS mass_high_precision,
      CASE WHEN abs((((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)) < 5 THEN 'Yes' WHEN abs((((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)) >= 5 THEN 'No' END                            AS radius_high_precision,
      CASE WHEN abs((((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)) < 5 AND abs((((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)) < 5 AND abs((((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)) < 5 THEN 'Yes' WHEN abs((((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)) >= 5 OR abs((((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)) >= 5 OR abs((((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)) >= 5 THEN 'No' END     AS well_characterized_planet,
      CASE WHEN abs((((q.perioderr1 - q.perioderr2) / 2.0) / NULLIF(o.period, 0) * 100.0)) < 5 AND abs((((q.masserr1 - q.masserr2) / 2.0) / NULLIF(ph.massjup, 0) * 100.0)) < 5 AND abs((((q.raderr1 - q.raderr2) / 2.0) / NULLIF(ph.radjup, 0) * 100.0)) < 5 THEN 1 ELSE 0 END
                                                          AS well_characterized_indicator,
      1                                                   AS planet_row_count
  FROM bird.planets_data.planets p

  JOIN bird.planets_data.stars s ON s.stellarref = p.hostlink

  LEFT JOIN bird.planets_data.orbital_characteristics o ON o.bodylink =
  p.planetref

  LEFT JOIN bird.planets_data.physical_properties ph ON ph.objectlink =
  p.planetref

  LEFT JOIN bird.planets_data.data_quality_tracking q ON q.targetlink =
  p.planetref

  LEFT JOIN obs ON obs.planet = p.planetref

  LEFT JOIN ordered ord ON ord.planet = p.planetref

  ) q
