unique_name: Planet Observation
object_type: dataset
label: Planet Observation
columns:
  - name: observation
    data_type: long
  - name: planet
    data_type: long
  - name: star
    data_type: long
  - name: facility
    data_type: string
  - name: observation_row_count
    data_type: int
connection_id: bird_planets_data
qds_materialization: true
sql: >-
  SELECT
      io.obsref                                           AS observation,
      io.subjectlink                                      AS planet,
      p.hostlink                                          AS star,
      i.facilityname                                      AS facility,
      1                                                   AS observation_row_count
  FROM dna_fcty_tda.bird.planet_instrument_observations io

  JOIN dna_fcty_tda.bird.instruments_surveys i ON i.instrumentref =
  io.facilitylink

  JOIN dna_fcty_tda.bird.planets p ON p.planetref = io.subjectlink
