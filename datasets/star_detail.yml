connection_id: bird_planets_data
qds_materialization: true
sql: |-
  SELECT q.*,
    CASE WHEN q.stellar_distance_pc IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_distance_pc,
    CASE WHEN q.stellar_mass IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_mass,
    CASE WHEN q.stellar_radius IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_radius,
    CASE WHEN q.stellar_temperature IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_temperature,
    CASE WHEN q.stellar_luminosity IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_luminosity,
    CASE WHEN q.stellar_density_solar IS NOT NULL THEN 1 ELSE 0 END AS has_stellar_density_solar,
    CASE WHEN q.optical_magnitude IS NOT NULL THEN 1 ELSE 0 END AS has_optical_magnitude,
    CASE WHEN q.max_adjacent_period_ratio IS NOT NULL THEN 1 ELSE 0 END AS has_max_adjacent_period_ratio,
    q.stellar_distance_pc AS stellar_distance_pc_measure,
    q.stellar_distance_ly AS stellar_distance_ly_measure,
    q.stellar_mass AS stellar_mass_measure,
    q.stellar_radius AS stellar_radius_measure,
    q.stellar_temperature AS stellar_temperature_measure,
    q.optical_magnitude AS optical_magnitude_measure,
    q.stellar_luminosity AS stellar_luminosity_measure,
    q.stellar_density_kg_m3 AS stellar_density_kg_m3_measure,
    q.stellar_density_solar AS stellar_density_solar_measure,
    q.gravitational_parameter AS gravitational_parameter_measure,
    q.habitable_zone_inner_au AS habitable_zone_inner_au_measure,
    q.habitable_zone_outer_au AS habitable_zone_outer_au_measure,
    q.star_planet_count AS star_planet_count_measure,
    q.companion_count AS companion_count_measure,
    q.shortest_orbital_period AS shortest_orbital_period_measure,
    q.max_adjacent_period_ratio AS max_adjacent_period_ratio_measure,
    q.mean_adjacent_period_ratio AS mean_adjacent_period_ratio_measure,
    q.geometric_mean_adjacent_period_ratio AS geometric_mean_adjacent_period_ratio_measure,
    q.adjacent_pair_count AS adjacent_pair_count_measure,
    q.star_gas_giant_count AS star_gas_giant_count_measure,
    q.star_rocky_planet_count AS star_rocky_planet_count_measure,
    q.star_planets_with_density AS star_planets_with_density_measure,
    q.star_short_period_count AS star_short_period_count_measure,
    q.star_transit_discovery_count AS star_transit_discovery_count_measure,
    q.star_radial_velocity_count AS star_radial_velocity_count_measure,
    q.kepler_observation_indicator AS kepler_observation_indicator_measure,
    q.k2_observation_indicator AS k2_observation_indicator_measure,
    q.ttv_observation_indicator AS ttv_observation_indicator_measure
  FROM (
  WITH ratios AS (
      SELECT
          pp.hostlink                                     AS star,
          oo.period                                       AS period,
          lead(oo.period) OVER (
              PARTITION BY pp.hostlink
              ORDER BY oo.period)                         AS next_period
      FROM dna_fcty_tda.brid.planets pp
      JOIN dna_fcty_tda.brid.orbital_characteristics oo ON oo.bodylink = pp.planetref
  ),
  pairs AS (
      SELECT
          star,
          count(*) FILTER (WHERE next_period IS NOT NULL) AS adjacent_pair_count,
          max(next_period / NULLIF(period, 0))            AS max_ratio,
          min(next_period / NULLIF(period, 0))            AS min_ratio,
          avg(next_period / NULLIF(period, 0))            AS avg_ratio,
          exp(avg(ln(next_period / NULLIF(period, 0))))   AS geo_ratio
      FROM ratios
      GROUP BY star
  ),
  per_star AS (
      SELECT
          pp.hostlink                                     AS star,
          count(*)                                        AS planet_count,
          min(oo.period)                                  AS shortest_period,
          max(oo.period)                                  AS longest_period,
          min(oo.semimajor)                               AS innermost_semi_major,
          max(oo.semimajor)                               AS outermost_semi_major,
          max(php.massjup)                                AS heaviest_planet_mass,
          max(php.radjup)                                 AS largest_planet_radius,
          max(php.densvalue)                              AS densest_planet,
          sum(CASE WHEN php.massjup > 0.1 THEN 1 ELSE 0 END) AS gas_giant_count,
          sum(CASE WHEN php.densvalue > 3 THEN 1 ELSE 0 END) AS rocky_count,
          count(php.densvalue)                            AS planets_with_density,
          count(CASE WHEN php.densvalue IS NOT NULL OR php.massjup IS NOT NULL
                     THEN 1 END)                          AS planets_with_composition,
          sum(CASE WHEN oo.period < 10 THEN 1 ELSE 0 END) AS short_period_count,
          sum(CASE WHEN CASE WHEN lower(trim(pp.discmethod)) IN ('radvel', 'rv', 'rv method', 'radial velocity', 'doppler') THEN 'Radial Velocity' WHEN lower(trim(pp.discmethod)) IN ('transit', 'tr', 'transit method', 'photometry', 'photometric') THEN 'Transit' WHEN lower(trim(pp.discmethod)) IN ('direct imaging', 'di', 'imaging', 'img', 'direct') THEN 'Imaging' WHEN lower(trim(pp.discmethod)) IN ('ttv', 'transit timing variations', 'transit timing', 'ttv method', 'timing var') THEN 'TTV' WHEN lower(trim(pp.discmethod)) IN ('microlensing', 'ml', 'lensing', 'gravitational') OR trim(pp.discmethod) = concat(decode(unhex('CEBC'), 'UTF-8'), 'Lens') THEN 'Microlensing' ELSE 'Other' END = 'Transit' THEN 1 ELSE 0 END)        AS transit_discovery_count,
          sum(CASE WHEN CASE WHEN lower(trim(pp.discmethod)) IN ('radvel', 'rv', 'rv method', 'radial velocity', 'doppler') THEN 'Radial Velocity' WHEN lower(trim(pp.discmethod)) IN ('transit', 'tr', 'transit method', 'photometry', 'photometric') THEN 'Transit' WHEN lower(trim(pp.discmethod)) IN ('direct imaging', 'di', 'imaging', 'img', 'direct') THEN 'Imaging' WHEN lower(trim(pp.discmethod)) IN ('ttv', 'transit timing variations', 'transit timing', 'ttv method', 'timing var') THEN 'TTV' WHEN lower(trim(pp.discmethod)) IN ('microlensing', 'ml', 'lensing', 'gravitational') OR trim(pp.discmethod) = concat(decode(unhex('CEBC'), 'UTF-8'), 'Lens') THEN 'Microlensing' ELSE 'Other' END = 'Radial Velocity' THEN 1 ELSE 0 END)         AS radial_velocity_count
      FROM dna_fcty_tda.brid.planets pp
      LEFT JOIN dna_fcty_tda.brid.orbital_characteristics oo ON oo.bodylink = pp.planetref
      LEFT JOIN dna_fcty_tda.brid.physical_properties php ON php.objectlink = pp.planetref
      GROUP BY pp.hostlink
  ),
  star_obs AS (
      SELECT
          pp.hostlink                                     AS star,
          max(CASE WHEN i.facilityname = 'kep' THEN 1 ELSE 0 END) AS kepler_flag,
          max(CASE WHEN i.facilityname = 'k2' THEN 1 ELSE 0 END)  AS k2_flag,
          max(CASE WHEN i.facilityname = 'ttv' THEN 1 ELSE 0 END) AS ttv_flag
      FROM dna_fcty_tda.brid.planet_instrument_observations io
      JOIN dna_fcty_tda.brid.instruments_surveys i ON i.instrumentref = io.facilitylink
      JOIN dna_fcty_tda.brid.planets pp ON pp.planetref = io.subjectlink
      GROUP BY pp.hostlink
  )
  SELECT
      s.stellarref                                        AS star,
      s.hostplname                                        AS star_name,
      CAST(CAST(CAST((s.stellardist) AS FLOAT) AS STRING) AS DECIMAL(38,10))                               AS stellar_distance_pc,
      (s.stellardist * 3.26156)                       AS stellar_distance_ly,
      CAST(s.compcount AS DOUBLE)                       AS companion_count,
      CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS DECIMAL(38,10))                                    AS stellar_mass,
      CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS DECIMAL(38,10))                                  AS stellar_radius,
      CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS DECIMAL(38,10))                                    AS stellar_temperature,
      CAST((get_json_object(s.stellarprops, '$.photometry.Opt_Mag')) AS DECIMAL(38,10))                                         AS optical_magnitude,
      get_json_object(s.stellarprops, '$.photometry.Photo_Band')                                             AS photometric_band_stored,
      CASE WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('v (johnson)', 'johnson', 'v', 'johnson v', 'v-band') THEN 'Johnson V' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('kepler-band', 'kepler', 'kep-b', 'kep') THEN 'Kepler' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) = 'k-band' THEN 'K-band' WHEN get_json_object(s.stellarprops, '$.photometry.Photo_Band') IS NOT NULL THEN 'Other' END                                     AS photometric_band,
      CASE WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('v (johnson)', 'johnson', 'v', 'johnson v') THEN 'Johnson V' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) = 'v-band' THEN 'V-band' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('kepler-band', 'kepler', 'kep-b', 'kep') THEN 'Kepler' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) = 'k-band' THEN 'K-band' WHEN get_json_object(s.stellarprops, '$.photometry.Photo_Band') IS NOT NULL THEN 'Other' END                                       AS photometric_band_strict,
      CASE WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('v (johnson)', 'johnson', 'v', 'johnson v', 'v-band') THEN 'V-Band' WHEN lower(trim(get_json_object(s.stellarprops, '$.photometry.Photo_Band'))) IN ('kepler-band', 'kepler', 'kep-b', 'kep') THEN 'Kepler-Band' END                                       AS photometric_band_group,
      (POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4))                                        AS stellar_luminosity,
      SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 1.1)                                          AS habitable_zone_inner_au,
      SQRT((POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 2) * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Value')) AS FLOAT) / 5778, 4)) / 0.53)                                          AS habitable_zone_outer_au,
      ((CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) * 1.98847E30) / NULLIF(4.0/3.0 * PI() * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT) * 6.957E8, 3), 0))                             AS stellar_density_kg_m3,
      (CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) / NULLIF(4.0/3.0 * PI() * POWER(CAST((get_json_object(s.stellarprops, '$.physical.Radius_Value')) AS FLOAT), 3), 0))                             AS stellar_density_solar,
      (6.67430E-11 * CAST((get_json_object(s.stellarprops, '$.physical.Mass_Value')) AS FLOAT) * 1.98847E30)                                    AS gravitational_parameter,
      CAST((get_json_object(s.coordsys, '$.RA_Decimal')) AS DOUBLE)                         AS right_ascension_degrees,
      CAST((get_json_object(s.coordsys, '$.Dec_Decimal')) AS DOUBLE)                        AS declination_degrees,
      get_json_object(s.coordsys, '$.RA_Text')                                    AS right_ascension_text,
      get_json_object(s.coordsys, '$.Dec_Text')                                   AS declination_text,
      CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE)                         AS temperature_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.physical.Mass_Blend')) AS DOUBLE)                         AS mass_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.physical.Rad_Blend')) AS DOUBLE)                          AS radius_blend_flag,
      CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE)                          AS magnitude_blend_flag,
      CASE WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) = 1 THEN 'Yes' WHEN CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE) IS NOT NULL THEN 'No' END                 AS star_magnitude_blended,
      CASE WHEN COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Temp_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Mass_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.physical.Rad_Blend')) AS DOUBLE), 0) = 1
                OR COALESCE(CAST((get_json_object(s.stellarprops, '$.photometry.Mag_Blend')) AS DOUBLE), 0) = 1
           THEN 'Yes' ELSE 'No' END                       AS any_blended_measurement,
      CAST(ps.planet_count AS DOUBLE)                   AS star_planet_count,
      CAST(CAST(CAST((ps.shortest_period) AS FLOAT) AS STRING) AS DECIMAL(38,10))                          AS shortest_orbital_period,
      CAST(CAST(CAST((ps.longest_period) AS FLOAT) AS STRING) AS DECIMAL(38,10))                           AS longest_orbital_period,
      CAST(CAST(CAST((ps.innermost_semi_major) AS FLOAT) AS STRING) AS DECIMAL(38,10))                     AS innermost_semi_major_axis,
      CAST(CAST(CAST((ps.outermost_semi_major) AS FLOAT) AS STRING) AS DECIMAL(38,10))                     AS outermost_semi_major_axis,
      CAST(CAST(CAST((ps.heaviest_planet_mass) AS FLOAT) AS STRING) AS DECIMAL(38,10))                     AS heaviest_planet_mass_jupiter,
      CAST(CAST(CAST((ps.largest_planet_radius) AS FLOAT) AS STRING) AS DECIMAL(38,10))                    AS largest_planet_radius_jupiter,
      CAST(CAST(CAST((ps.densest_planet) AS FLOAT) AS STRING) AS DECIMAL(38,10))                           AS densest_planet_density,
      CAST(ps.gas_giant_count AS DOUBLE)                AS star_gas_giant_count,
      CAST(ps.rocky_count AS DOUBLE)                    AS star_rocky_planet_count,
      CAST(ps.planets_with_density AS DOUBLE)           AS star_planets_with_density,
      CAST(ps.planets_with_composition AS DOUBLE)       AS star_planets_with_composition,
      CAST(ps.short_period_count AS DOUBLE)             AS star_short_period_count,
      CAST(ps.transit_discovery_count AS DOUBLE)        AS star_transit_discovery_count,
      CAST(ps.radial_velocity_count AS DOUBLE)          AS star_radial_velocity_count,
      CAST(pr.adjacent_pair_count AS DOUBLE)            AS adjacent_pair_count,
      pr.max_ratio                                        AS max_adjacent_period_ratio,
      pr.min_ratio                                        AS min_adjacent_period_ratio,
      pr.avg_ratio                                        AS mean_adjacent_period_ratio,
      pr.geo_ratio                                        AS geometric_mean_adjacent_period_ratio,
      COALESCE(so.kepler_flag, 0)                         AS kepler_observation_indicator,
      COALESCE(so.k2_flag, 0)                             AS k2_observation_indicator,
      COALESCE(so.ttv_flag, 0)                            AS ttv_observation_indicator,
      CASE WHEN s.compcount > 1 THEN 'Yes' ELSE 'No' END  AS multi_planetary_system,
      CASE WHEN s.compcount > 1 THEN 1 ELSE 0 END         AS multi_planetary_indicator,
      CASE WHEN ps.planet_count > 1 THEN 'Yes' ELSE 'No' END
                                                          AS multiple_planet_rows,
      CASE WHEN ps.planets_with_composition = 0 THEN NULL
           WHEN ps.rocky_count > 0 AND ps.gas_giant_count = 0 THEN 'Rocky Only'
           WHEN ps.gas_giant_count > 0 AND ps.rocky_count = 0 THEN 'Gas Giants Only'
           WHEN ps.rocky_count > 0 AND ps.gas_giant_count > 0 THEN 'Mixed'
           ELSE 'Neither' END                             AS system_composition,
      CASE WHEN ps.planets_with_composition = 0 THEN NULL
           WHEN ps.rocky_count > 0 THEN 'Yes' ELSE 'No' END AS has_rocky_planet,
      CASE WHEN ps.planets_with_composition = 0 THEN NULL
           WHEN ps.gas_giant_count > 0 THEN 'Yes' ELSE 'No' END AS has_gas_giant,
      CASE WHEN ps.rocky_count > 0 AND ps.gas_giant_count = 0 THEN 1 ELSE 0 END
                                                          AS rocky_only_indicator,
      CASE WHEN ps.gas_giant_count > 0 AND ps.rocky_count = 0 THEN 1 ELSE 0 END
                                                          AS gas_giants_only_indicator,
      CASE WHEN ps.rocky_count = ps.planets_with_density
                AND ps.planets_with_density > 0 THEN 'Yes'
           WHEN ps.planets_with_density > 0 THEN 'No' END  AS all_density_measured_rocky,
      1                                                   AS star_row_count
  FROM dna_fcty_tda.brid.stars s
  LEFT JOIN per_star ps ON ps.star = s.stellarref
  LEFT JOIN pairs pr ON pr.star = s.stellarref
  LEFT JOIN star_obs so ON so.star = s.stellarref
  ) q
